<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRT WebGL</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; }

  .monitor {
    width: 100vw; height: 100dvh; box-sizing: border-box;
    padding: 2.5vmin;
    background: linear-gradient(145deg, #4a4f4a, #2a2d2a 50%, #1a1c1a);
    box-shadow: inset 0 0 0 2px #5c615c, inset 0 0 30px rgba(0,0,0,.6);
  }
  .crt {
    position: relative; width: 100%; height: 100%;
    overflow: hidden; border-radius: 6% / 10%;
    background: #000;
    box-shadow: 0 0 0 6px #111, 0 0 0 8px #3a3e3a;
  }
  canvas#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* dark edges so the glass reads as curving away */
  .crt::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    box-shadow: inset 0 0 8vmin rgba(0,0,0,.85), inset 0 0 1.5vmin #000;
    border-radius: inherit;
  }
</style>
</head>
<body>
<div class="monitor"><div class="crt"><canvas id="gl" tabindex="0"></canvas></div></div>

<script>
// ---------- content: edit these ----------
const TITLE  = "What am i doing";
const BUTTON = "Hello";
const BODY   = ("this is a big long paragraph ".repeat(40) + " ").repeat(4);

// ---------- look ----------
const COLOR = "#33ff55";
const FONT  = '"Courier New", monospace';
const CURVE = 0.12;     // dome strength: 0 = flat, 0.2 = very round
const PAD   = 8;        // left/right text padding in css px

// ---------- setup ----------
const glc = document.getElementById("gl");
const gl  = glc.getContext("webgl", { antialias: false });
const cv  = document.createElement("canvas");   // text is drawn here, then uploaded as a texture
const ctx = cv.getContext("2d");
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;

if (!gl) {
  document.querySelector(".crt").insertAdjacentHTML("beforeend",
    '<p style="color:#33ff55;font:20px monospace;padding:2em">WebGL is not available in this browser.</p>');
  throw new Error("no webgl");
}

const VS = `attribute vec2 p; varying vec2 v;
void main(){ v = p*.5+.5; gl_Position = vec4(p,0.,1.); }`;

const FS = `precision highp float;
uniform sampler2D t; uniform vec2 res; uniform float time, k, flick;
varying vec2 v;
void main(){
  vec2 uv = v*2.-1.;
  float r2 = dot(uv,uv);
  // barrel warp: each axis is squeezed by the other coordinate, so lines bow outward
  vec2 w = vec2(uv.x*(1.-k*uv.y*uv.y), uv.y*(1.-k*uv.x*uv.x));
  vec2 s = w*.5+.5;
  vec2 px = 1./res;

  vec3 c = texture2D(t, s).rgb;
  vec3 g = vec3(0.);                       // cheap bloom: average of nearby texels
  for (int i=-2;i<=2;i++) for (int j=-2;j<=2;j++)
    g += texture2D(t, s + vec2(float(i),float(j))*px*2.5).rgb;
  g /= 25.;

  vec3 col = c + g*1.8;
  col += vec3(.015,.075,.025) * (1.-.6*r2);                 // phosphor glow behind the text
  col *= .8 + .2*sin(v.y*res.y*3.14159);                    // scanlines
  col *= 1. + .05*sin(v.y*5. - time*1.5);                   // slow rolling band
  float n = fract(sin(floor(time*24.)*91.7)*43758.5);
  col *= 1. - flick*(.025 + .03*step(.97,n));               // subtle flicker
  col *= 1. - .6*pow(r2/2., 1.6);                           // vignette
  col += vec3(.05,.07,.05) * smoothstep(.4,0.,distance(v,vec2(.28,.82)));  // glass glare
  gl_FragColor = vec4(col,1.);
}`;

function shader(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, shader(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog); gl.useProgram(prog);

gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);  // one big triangle
const loc = gl.getAttribLocation(prog, "p");
gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

const tex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, tex);
for (const [a, b] of [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR],
                      [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]])
  gl.texParameteri(gl.TEXTURE_2D, a, b);
gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);

const U = n => gl.getUniformLocation(prog, n);
gl.uniform1f(U("k"), CURVE);
gl.uniform1f(U("flick"), still ? 0 : 1);

// ---------- layout (all in css px) ----------
let W, H, dpr, u, items, totalH;
let scroll = 0, target = 0, dirty = true;

function layout() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  u = Math.max(14, Math.min(W / 60, 32));
  items = [];
  let y = u * 1.5;

  const tf = `bold ${u * 2}px ${FONT}`;
  items.push({ k: "text", s: TITLE, x: W / 2, y, font: tf, align: "center" });
  y += u * 2 * 1.2 + u * 1.5;

  const bf = `${u * 1.2}px ${FONT}`;
  ctx.font = bf;
  const bw = ctx.measureText(BUTTON).width + u * 1.6, bh = u * 1.2 * 1.6;
  items.push({ k: "btn", s: BUTTON, x: (W - bw) / 2, y, w: bw, h: bh, font: bf });
  y += bh + u * 1.5;

  const pf = `${u}px ${FONT}`;
  ctx.font = pf;
  const maxW = W - PAD * 2, sp = ctx.measureText(" ").width, lh = u * 1.3;
  let line = [], lw = 0;
  const flush = last => { items.push({ k: "para", words: line, y, last, font: pf, maxW, sp }); y += lh; line = []; lw = 0; };
  for (const s of BODY.split(/\s+/).filter(Boolean)) {
    const w = ctx.measureText(s).width;
    if (line.length && lw + sp + w > maxW) flush(false);
    lw += (line.length ? sp : 0) + w; line.push({ s, w });
  }
  if (line.length) flush(true);

  totalH = y + u * 2;
  target = Math.min(target, Math.max(0, totalH - H));
  scroll = Math.min(scroll, Math.max(0, totalH - H));
}

function renderText() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = COLOR; ctx.strokeStyle = COLOR; ctx.lineWidth = 2;
  ctx.textBaseline = "top";
  for (const it of items) {
    const y = it.y - scroll;
    if (y > H + 60 || y < -(it.h || u * 3)) continue;     // skip lines that are off screen
    ctx.font = it.font;
    if (it.k === "text") { ctx.textAlign = it.align; ctx.fillText(it.s, it.x, y); }
    else if (it.k === "btn") {
      ctx.textAlign = "center";
      ctx.strokeRect(it.x, y, it.w, it.h);
      ctx.fillText(it.s, it.x + it.w / 2, y + (it.h - u * 1.2) / 2);
    } else {
      ctx.textAlign = "left";
      const n = it.words.length, sum = it.words.reduce((a, w) => a + w.w, 0);
      const gap = !it.last && n > 1 ? (it.maxW - sum) / (n - 1) : it.sp;   // justify all but the last line
      let x = PAD;
      for (const w of it.words) { ctx.fillText(w.s, x, y); x += w.w + gap; }
    }
  }
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, cv);
}

function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = glc.clientWidth; H = glc.clientHeight;
  glc.width = cv.width = Math.round(W * dpr);
  glc.height = cv.height = Math.round(H * dpr);
  gl.viewport(0, 0, glc.width, glc.height);
  gl.uniform2f(U("res"), glc.width, glc.height);
  layout(); dirty = true;
}
addEventListener("resize", resize);

// ---------- scrolling ----------
const clamp = v => Math.max(0, Math.min(v, totalH - H));
glc.addEventListener("wheel", e => {
  e.preventDefault();
  target = clamp(target + e.deltaY * (e.deltaMode === 1 ? 16 : 1));
}, { passive: false });

let ty = null;
glc.addEventListener("pointerdown", e => { ty = e.clientY; glc.setPointerCapture(e.pointerId); });
glc.addEventListener("pointermove", e => { if (ty !== null) { target = clamp(target + ty - e.clientY); scroll = target; dirty = true; ty = e.clientY; } });
glc.addEventListener("pointerup", () => ty = null);

addEventListener("keydown", e => {
  const step = { ArrowDown: 60, ArrowUp: -60, PageDown: H * .9, PageUp: -H * .9, " ": H * .9 }[e.key];
  if (step !== undefined) { e.preventDefault(); target = clamp(target + step); }
  if (e.key === "Home") target = 0;
  if (e.key === "End") target = clamp(totalH);
});

// ---------- loop ----------
function frame(ms) {
  scroll += (target - scroll) * .2;
  if (Math.abs(target - scroll) < .1) scroll = target;
  if (scroll !== (frame.last ?? NaN)) { dirty = true; frame.last = scroll; }
  if (dirty) { renderText(); dirty = false; }       // only re-upload the texture when something moved
  gl.uniform1f(U("time"), still ? 0 : ms / 1000);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}

resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
